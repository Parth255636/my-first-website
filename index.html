<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Semantic Web Page</title>
</head>
<body>

    <!-- Semantic Tag 1: header -->
    <header>
        <!-- Requirement a: Includes an h1 tag -->
        <h1>Welcome to My Favorite Hobbies</h1>
    </header>

    <!-- Semantic Tag 2: main -->
    <main>
        
        <!-- Semantic Tag 3: section -->
        <section>
            <h2>Things I Enjoy</h2>
            
            <!-- Requirement b: List with at least three items -->
            <ul>
                <li>Reading books</li>
                <li>Coding web pages</li>
                <li>Hiking in nature</li>
            </ul>
        </section>

        <section>
            <h2>Gallery</h2>
            <!-- Requirement c: Includes at least three images -->
            <!-- Note: Replace the placeholder URLs with your actual image paths -->
            <img src="https://placeholder.com" alt="Placeholder Image 1">
            <img src="https://placeholder.com" alt="Placeholder Image 2">
            <img src="https://placeholder.com" alt="Placeholder Image 3">
        </section>

    </main>

    <footer>
        <!-- Requirement d: At least one link to an external source -->
        <p>Learn more about coding at <a href="https://w3schools.com" target="_blank">W3Schools</a>.</p>
    </footer>

</body>
</html>
